<div>
  <h2 id="page-heading" data-cy="GlobalTopsongsHeading">
    <fa-icon [icon]="'rectangle-xmark'" class="heading-icon"></fa-icon>
    <span class="heading-text">Global Top Songs & Artists</span>
  </h2>

  <div class="top-controls">
    <fa-icon [icon]="'house-user'" class="icon-button" (click)="goHome()" aria-label="Go to Home Page"></fa-icon>
    <span class="custom-tab-1" [class.active]="currentView === 'month'" (click)="showChart('month')"> This Month </span>
    <span class="custom-tab" [class.active]="currentView === 'year'" (click)="showChart('year')"> This Year </span>
  </div>

  <div class="playlist-song">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Album</th>
          <th>Song</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let song of filteredSongs; let i = index">
          <td>
            <a [routerLink]="['/global-topsongs', song.id, 'view']">{{ i + 1 }}</a>
          </td>
          <td class="song-title">
            <div class="song-image">
              <fa-icon [icon]="'rectangle-xmark'"></fa-icon>
            </div>
          </td>
          <td class="song-name-artist">
            <div class="song-name">
              {{ song.songTitle }}
            </div>
            <div class="artist-name">
              {{ song.artistName }}
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
