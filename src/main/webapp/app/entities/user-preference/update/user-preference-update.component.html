<div class="d-flex justify-content-center">
  <div class="col-8">
    <form name="editForm" novalidate (ngSubmit)="save()" [formGroup]="editForm">
      <h2 id="jhi-user-preference-heading" data-cy="UserPreferenceCreateUpdateHeading">Create or edit a User Preference</h2>

      <div>
        <jhi-alert-error></jhi-alert-error>

        @if (editForm.controls.id.value !== null) {
          <div class="mb-3">
            <label class="form-label" for="field_id">ID</label>
            <input type="number" class="form-control" name="id" id="field_id" data-cy="id" formControlName="id" [readonly]="true" />
          </div>
        }

        <div class="mb-3">
          <label class="form-label" for="field_favoriteGenre">Favorite Genre</label>
          <input
            type="text"
            class="form-control"
            name="favoriteGenre"
            id="field_favoriteGenre"
            data-cy="favoriteGenre"
            formControlName="favoriteGenre"
          />
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_musicPurpose">Music Purpose</label>
          <input
            type="text"
            class="form-control"
            name="musicPurpose"
            id="field_musicPurpose"
            data-cy="musicPurpose"
            formControlName="musicPurpose"
          />
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_musicMood">Music Mood</label>
          <input type="text" class="form-control" name="musicMood" id="field_musicMood" data-cy="musicMood" formControlName="musicMood" />
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_vocalPreference">Vocal Preference</label>
          <input
            type="text"
            class="form-control"
            name="vocalPreference"
            id="field_vocalPreference"
            data-cy="vocalPreference"
            formControlName="vocalPreference"
          />
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_listeningTime">Listening Time</label>
          <input
            type="text"
            class="form-control"
            name="listeningTime"
            id="field_listeningTime"
            data-cy="listeningTime"
            formControlName="listeningTime"
          />
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_listeningPattern">Listening Pattern</label>
          <input
            type="text"
            class="form-control"
            name="listeningPattern"
            id="field_listeningPattern"
            data-cy="listeningPattern"
            formControlName="listeningPattern"
          />
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_songLength">Song Length</label>
          <input
            type="text"
            class="form-control"
            name="songLength"
            id="field_songLength"
            data-cy="songLength"
            formControlName="songLength"
          />
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_lyricsImportance">Lyrics Importance</label>
          <input
            type="text"
            class="form-control"
            name="lyricsImportance"
            id="field_lyricsImportance"
            data-cy="lyricsImportance"
            formControlName="lyricsImportance"
          />
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_user">User</label>
          <select class="form-control" id="field_user" data-cy="user" name="user" formControlName="user" [compareWith]="compareUser">
            <option [ngValue]="null"></option>
            @for (userOption of usersSharedCollection; track $index) {
              <option [ngValue]="userOption">{{ userOption.login }}</option>
            }
          </select>
        </div>
      </div>

      <div>
        <button type="button" id="cancel-save" data-cy="entityCreateCancelButton" class="btn btn-secondary" (click)="previousState()">
          <fa-icon icon="ban"></fa-icon>&nbsp;<span>Cancel</span>
        </button>

        <button
          type="submit"
          id="save-entity"
          data-cy="entityCreateSaveButton"
          [disabled]="editForm.invalid || isSaving"
          class="btn btn-primary"
        >
          <fa-icon icon="save"></fa-icon>&nbsp;<span>Save</span>
        </button>
      </div>
    </form>
  </div>
</div>
