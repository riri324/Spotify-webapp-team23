<div>
  <h2 id="page-heading" data-cy="LikedSongsHeading">
    <span>Liked Songs</span>

    <div class="d-flex justify-content-end">
      <button class="btn btn-info me-2" (click)="load()" [disabled]="isLoading">
        <fa-icon icon="sync" [animation]="isLoading ? 'spin' : undefined"></fa-icon>
        <span>Refresh list</span>
      </button>

      <button
        id="jh-create-entity"
        data-cy="entityCreateButton"
        class="btn btn-primary jh-create-entity create-liked-songs"
        [routerLink]="['/liked-songs/new']"
      >
        <fa-icon icon="plus"></fa-icon>
        <span>Create a new Liked Songs</span>
      </button>
    </div>
  </h2>

  <jhi-alert-error></jhi-alert-error>

  <jhi-alert></jhi-alert>

  @if (likedSongs?.length === 0) {
    <div class="alert alert-warning" id="no-result">
      <span>No Liked Songs found</span>
    </div>
  }

  @if (likedSongs && likedSongs.length > 0) {
    <div class="table-responsive table-entities" id="entities">
      <table class="table table-striped" aria-describedby="page-heading">
        <thead>
          <tr jhiSort [sortState]="sortState" (sortChange)="navigateToWithComponentValues($event)">
            <th scope="col" jhiSortBy="id">
              <div class="d-flex">
                <span>ID</span>

                <fa-icon class="p-1" icon="sort"></fa-icon>
              </div>
            </th>
            <th scope="col" jhiSortBy="likeID">
              <div class="d-flex">
                <span>Like ID</span>

                <fa-icon class="p-1" icon="sort"></fa-icon>
              </div>
            </th>
            <th scope="col" jhiSortBy="song.id">
              <div class="d-flex">
                <span>Song</span>
                <fa-icon class="p-1" icon="sort"></fa-icon>
              </div>
            </th>
            <th scope="col"></th>
          </tr>
        </thead>
        <tbody>
          @for (likedSongs of likedSongs; track trackId(likedSongs)) {
            <tr data-cy="entityTable">
              <td>
                <a [routerLink]="['/liked-songs', likedSongs.id, 'view']">{{ likedSongs.id }}</a>
              </td>
              <td>{{ likedSongs.likeID }}</td>
              <td>
                @if (likedSongs.song) {
                  <div>
                    <a [routerLink]="['/song', likedSongs.song.id, 'view']">{{ likedSongs.song.id }}</a>
                  </div>
                }
              </td>
              <td class="text-end">
                <div class="btn-group">
                  <a [routerLink]="['/liked-songs', likedSongs.id, 'view']" class="btn btn-info btn-sm" data-cy="entityDetailsButton">
                    <fa-icon icon="eye"></fa-icon>
                    <span class="d-none d-md-inline">View</span>
                  </a>

                  <a [routerLink]="['/liked-songs', likedSongs.id, 'edit']" class="btn btn-primary btn-sm" data-cy="entityEditButton">
                    <fa-icon icon="pencil-alt"></fa-icon>
                    <span class="d-none d-md-inline">Edit</span>
                  </a>

                  <button type="submit" (click)="delete(likedSongs)" class="btn btn-danger btn-sm" data-cy="entityDeleteButton">
                    <fa-icon icon="times"></fa-icon>
                    <span class="d-none d-md-inline">Delete</span>
                  </button>
                </div>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  }
</div>
