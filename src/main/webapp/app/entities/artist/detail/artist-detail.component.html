<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (artist(); as artistRef) {
      <div>
        <h2 data-cy="artistDetailsHeading"><span>Artist</span></h2>

        <hr />

        <jhi-alert-error></jhi-alert-error>

        <jhi-alert></jhi-alert>

        <dl class="row-md jh-entity-details">
          <dt><span>ID</span></dt>
          <dd>
            <span>{{ artistRef.id }}</span>
          </dd>
          <dt><span>Artist Name</span></dt>
          <dd>
            <span>{{ artistRef.artistName }}</span>
          </dd>
          <dt><span>Followers</span></dt>
          <dd>
            <span>{{ artistRef.followers }}</span>
          </dd>
          <!-- This is only the part that needs fixing -->
          <dt><span>Image</span></dt>
          <dd>
            @if (artistRef.image) {
              <div>
                <a (click)="openFile(artistRef.image, artistRef.imageContentType)">
                  <img [src]="'data:' + artistRef.imageContentType + ';base64,' + artistRef.image" style="max-width: 100%" alt="artist" />
                </a>
                {{ artistRef.imageContentType }}, {{ byteSize(artistRef.image) }}
              </div>
            }
          </dd>
        </dl>

        <button type="submit" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
          <fa-icon icon="arrow-left"></fa-icon>&nbsp;<span>Back</span>
        </button>

        <button type="button" [routerLink]="['/artist', artistRef.id, 'edit']" class="btn btn-primary">
          <fa-icon icon="pencil-alt"></fa-icon>&nbsp;<span>Edit</span>
        </button>
      </div>
    }
  </div>
</div>
