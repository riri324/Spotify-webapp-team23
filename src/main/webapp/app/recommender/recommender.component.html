<div>
  <div class="d-flex justify-content-center">
    <div class="col-lg-6 col-md-8 col-sm-10">
      <h1 data-cy="recommenderTitle">Your recommended song here</h1>
      <div class="mb-3">
        <label class="playlist-label" for="playlist">Playlist</label>
        <input
          type="text"
          class="form-control"
          name="playlist"
          id="playlist"
          placeholder="Your playlist"
          formControlName="playlist"
          #playlist
          data-cy="playlist"
        />
      </div>

      <button type="submit" class="btn btn-primary" data-cy="submit">Get recommended songs here</button>
    </div>
  </div>
</div>
