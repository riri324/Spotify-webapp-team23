<div class="recommender-container">
  <div class="recommender-card">
    <h1>Song Recommender</h1>
    <p>Welcome, {{ userName }}!</p>
    <hr />
    <div class="recommender-content">
      <!-- My Playlists Section -->
      <div class="playlists-section">
        <h2>My Playlists</h2>
        @for (playlist of playlists; track playlist) {
          <div class="playlist-card">
            <!-- In the future add functionality that brings user to playlist page -->
            <button class="playlist-button">
              <h3>{{ playlist.name }}</h3>
              <p>{{ playlist.description }}</p>
            </button>
          </div>
        }
      </div>
      <!-- Recommended Songs Section -->
      <div class="recommended-section">
        <h2>Recommended Songs</h2>
        @for (song of recommendedSongs; track song) {
          <div class="song-card">
            <h3>{{ song.trackName }}</h3>
            <p>by {{ song.artists }}</p>
          </div>
        }
      </div>
    </div>
  </div>
</div>
