<div>
  @if (account() !== null) {
    <div class="alert alert-success">
      @if (account(); as accountRef) {
        <span id="home-logged-message">You are logged in as user &quot;{{ accountRef.login }}&quot;.</span>
      }
    </div>

    <div class="list-group mt-4" (keydown)="handleKeyDown($event)">
      <a
        *ngFor="let link of navLinks; let i = index"
        class="list-group-item list-group-item-action"
        routerLink="{{ link.route }}"
        tabindex="0"
        [attr.data-index]="i"
        [class.active]="i === focusedIndex"
        (focus)="focusedIndex = i"
        (click)="navigateTo(link.route)"
      >
        {{ link.label }}
      </a>
    </div>
  } @else {
    <!-- Guest view directly shown here -->
    <div class="alert alert-info">
      <p><strong>Welcome to Tifopsy :notes:</strong></p>
      <p>
        <a class="alert-link" routerLink="/account/register">
          Click here now to register and join our music community!
        </a>
      </p>
      <p>
        <a class="alert-link" (click)="login()">
          If you are already a member, login here
        </a>
      </p>
    </div>
  }
</div>
