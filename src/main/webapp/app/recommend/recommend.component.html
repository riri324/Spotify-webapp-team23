<div class="recommend-container">
  <!-- Header -->
  <header class="header">
    <h1>Music Connect</h1>
  </header>

  <!-- Recommended Users Section -->
  <section class="recommend-section">
    <h2>👥 User Recommendations</h2>

    <!-- Loading state -->
    <div class="loading" *ngIf="isLoading">Loading recommendations...</div>

    <!-- Error message -->
    <div class="error-message" *ngIf="errorMessage && !isLoading">{{ errorMessage }}</div>

    <!-- No recommendations state -->
    <div class="no-recommend" *ngIf="!isLoading && !errorMessage && recommendedUsers.length === 0">No recommendations found.</div>

    <!-- Recommendations list -->
    <ul class="user-list" *ngIf="!isLoading && !errorMessage && recommendedUsers.length > 0">
      <li class="user-item" *ngFor="let user of recommendedUsers">
        <div class="user-info">
          <div class="avatar">👤</div>
          <div>
            <p class="user-name">{{ user.recommendedUserId }}</p>
            <p class="common-songs">{{ user.commonSongsCount }} songs in common</p>
          </div>
        </div>
        <button class="follow-button">Follow</button>
      </li>
    </ul>

    <!-- Generate button -->
    <button class="generate-button" (click)="generateRecommendations()" [disabled]="isLoading">
      {{ isLoading ? 'Generating...' : 'Generate Recommendations' }}
    </button>
  </section>
</div>
