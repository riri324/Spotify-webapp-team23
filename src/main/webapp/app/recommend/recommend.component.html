<div class="recommend-container">
  <h1>Recommended Users</h1>

  <!-- Loading state -->
  <div *ngIf="isLoading">Loading...</div>

  <!-- Error message -->
  <div *ngIf="errorMessage && !isLoading">{{ errorMessage }}</div>

  <!-- No recommendations state -->
  <div *ngIf="!isLoading && !errorMessage && recommendedUsers.length === 0">No recommendations found.</div>

  <!-- Recommendations list -->
  <ul *ngIf="!isLoading && !errorMessage && recommendedUsers.length > 0">
    <li *ngFor="let user of recommendedUsers">{{ user.recommendedUserId }} - {{ user.commonSongsCount }} songs in common</li>
  </ul>

  <!-- Generate button -->
  <button (click)="generateRecommendations()" [disabled]="isLoading">
    {{ isLoading ? 'Generating...' : 'Generate Recommendations' }}
  </button>
</div>
